name: Reusable Badge Generator

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true
    inputs:
      python_version:
        type: string
        default: '3.13'

permissions:
  contents: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact

  badges:
    runs-on: ubuntu-latest
    needs: gitleaks
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Checkout badge tools from private central repo
        uses: actions/checkout@v4
        with:
          repository: electro-sb/cicd_central
          token: ${{ secrets.PAT_TOKEN }}
          path: .badge-tools
          sparse-checkout: |
            scripts
            assets/logo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version || '3.13' }}

      - name: Install dependencies
        run: pip install anybadge pydantic python-dotenv svgwrite

      - name: Copy scripts and logo
        run: |
          cp -r .badge-tools/scripts .
          mkdir -p assets/logo
          if [ -f .badge-tools/assets/logo/logo.png ]; then
            cp .badge-tools/assets/logo/logo.png assets/logo/
            echo "✓ Logo copied"
          fi
          if [ -f .badge-tools/assets/logo/profile.svg ]; then
            if head -n1 .badge-tools/assets/logo/profile.svg | grep -q "git-lfs"; then
              echo "Profile SVG is in LFS, downloading actual file..."
              cd .badge-tools
              git lfs pull --include="assets/logo/profile.svg"
              cd ..
            fi
            cp .badge-tools/assets/logo/profile.svg assets/logo/
            echo "✓ Profile SVG copied"
          fi

      - name: Run badge generator
        run: |
          echo "Generating badges on branch: $(git branch --show-current)"
          python scripts/badge_generator.py

      - name: Commit and push to current branch
        run: |
          CURRENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Committing to branch: $CURRENT_BRANCH"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-update badges [skip ci]"
          git push origin HEAD:$CURRENT_BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}